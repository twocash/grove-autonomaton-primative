# kaizen.yaml
# Three-Beat TPS Display
# Jidoka (watchman) -> Andon (cord) -> Kaizen (butler)

# Timing: seconds between beats. Each role lands before the next appears.
timing:
  beat_delay: 0.8

# Classification quality thresholds live in routing.config
# (router.classification.min_confidence) — not here.
# Kaizen governs the improvement RESPONSE. Classification
# quality is a Cognitive Router concern (Jidoka, not Kaizen).

#
# V-017: Three visually distinct TPS beats
# V-017b: Slim single-line headers replace FIGlet walls
# Each option maps to a capability handler method: _kaizen_{capability}

jidoka:
  header: "JIDOKA"
  role: "The watchman detected something."
  bar: "━"

andon:
  header: "ANDON"
  role: "The line is stopped."
  bar: "━"

kaizen:
  header: "KAIZEN"
  role: "The improvement proposal."
  bar: "━"

  # What tier model classifies intent when operator consents to LLM.
  # This is the CLASSIFICATION call — not the response generation.
  # Haiku is correct: classification is cheap work.
  classification_tier: 1

  prompt: |
    The LLM can learn what you mean — the Ratchet
    will cache it so it's free next time.
  options:
    "1":
      label: "Use the LLM to classify (cached after)"
      capability: llm_classify
    "2":
      label: "Answer with deeper reasoning (Sonnet)"
      capability: tiered_response
      tier: 2
    "3":
      label: "Answer from what you already know (free)"
      capability: local_context
      tier: 1
    "4":
      label: "Show me what you can help with (free)"
      capability: config_menu
    "5":
      label: "I'll rephrase"
      capability: cancel

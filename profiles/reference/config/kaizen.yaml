# kaizen.yaml
# Three-Beat TPS Display
# Jidoka (watchman) -> Andon (cord) -> Kaizen (butler)
#
# V-017: Transform Kaizen prompt into three visually distinct TPS beats
# Each option maps to a capability handler method: _kaizen_{capability}


# ============================================================
# ux.yaml — Reference Profile UX Configuration
# ============================================================
# Controls informational displays that make the architecture
# visible during the demo. Domain profiles can disable any
# element or customize messages.
#
# These are NOT prompts. They are post-pipeline displays.
# The pipeline produces results. This file controls how
# the REPL layer presents them.
# ============================================================

# --- THE RATCHET Announcement ---
# Fires when Stage 2 resolves from pattern cache (Tier 0).
# V-020: Visual weight comparable to Kaizen three-beat display.
# The Ratchet is the architectural counterpart to Kaizen —
# Kaizen shows the system stopping, the Ratchet shows it learning.
ratchet_announcement:
  enabled: true
  template: |

    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    THE RATCHET
    Classified by LLM last time → cached this time.
    Tier {tier}, ${cost}. The system got cheaper because you used it.
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# --- Tips (OOBE Teaching Sequence) ---
# Each tip fires once per session, highest priority wins.
# The priority chain IS the teaching sequence — each tip
# scaffolds the operator toward the next architectural insight.
#
# V-020 Sequence: keyword_match → llm_classification → ratchet_cache_hit
#                 → kaizen_fired → kaizen_fired_free_mode
tips:
  enabled: true
  events:
    keyword_match:
      priority: 1
      message: "Try something the system won't recognize to see what happens."
    llm_classification:
      priority: 2
      message: "That cost a fraction of a cent — with your permission. Try the exact same phrase again."
    ratchet_cache_hit:
      priority: 3
      message: "Type 'show cache' to see what the Ratchet stored. It's a file you can read."
    kaizen_fired:
      priority: 4
      message: "Three TPS roles just fired: Jidoka detected uncertainty. Andon stopped the line. Kaizen proposed options."
    kaizen_fired_free_mode:
      priority: 5
      message: "Type 'show patterns' to see what the Flywheel has detected from your session."
